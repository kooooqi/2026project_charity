<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 Project - 느리게 피어나지만 누구보다 아름다운 꽃</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            color: #111;
            background-color: #fff;
        }

        body {
            overflow-x: hidden;
            width: 100%;
        }

        /* 65% 스크롤 시 부드럽게 흐려지는 메인 히어로 영역 */
        .hero-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            min-height: 650px;
            overflow: hidden;
            transform: translateZ(0);
            will-change: filter, opacity;
            transition: filter 0.15s linear, opacity 0.15s linear;
        }

        .bg-layer {
            position: absolute;
            inset: 0;
            background-image: url('image_3.png');
            background-size: cover;
            background-position: center bottom;
            background-repeat: no-repeat;
            z-index: 1;
        }

        /* 거칠게 프레임이 떨어지는 글리치 노이즈 레이어 */
        .glitch-layer {
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
        }

        .red-noise {
            position: absolute;
            background-color: #FF0000;
            animation: steppedGlitch 1.2s infinite steps(2, jump-none) alternate;
        }

        /* PC 기준 노이즈 위치 */
        .noise-1 { top: 72px; right: 320px; width: 22px; height: 22px; animation-delay: 0s; }
        .noise-2 { top: 90px; right: 340px; width: 14px; height: 14px; animation-delay: 0.15s; }
        .noise-3 { bottom: 230px; right: 380px; width: 12px; height: 12px; animation-delay: 0.4s; }
        .noise-4 { left: 0; bottom: 140px; width: 48px; height: 22px; animation-delay: 0.1s; }
        .noise-5 { right: 50px; bottom: 30px; width: 70px; height: 16px; animation-delay: 0.3s; }

        @keyframes steppedGlitch {
            0% { transform: translate(0, 0); opacity: 0.95; clip-path: inset(0 0 0 0); }
            20% { transform: translate(-4px, 3px) scaleX(1.1); opacity: 0.4; clip-path: inset(10% 0 30% 0); }
            40% { transform: translate(5px, -2px) scaleY(0.9); opacity: 1; clip-path: inset(40% 0 10% 0); }
            60% { transform: translate(-2px, -4px); opacity: 0.2; clip-path: inset(20% 0 50% 0); }
            80% { transform: translate(6px, 1px) scale(1.05); opacity: 0.9; clip-path: inset(0 0 0 0); }
            100% { transform: translate(-1px, 3px); opacity: 0.7; clip-path: inset(5% 0 15% 0); }
        }

        /* 헤더 네비게이션 */
        header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center
